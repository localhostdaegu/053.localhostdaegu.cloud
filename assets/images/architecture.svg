  <title id="title">localhostdaegu 시스템 흐름 — 2026-09-18 사전상담 기준</title>
  <desc id="desc">질문과 지도 선택에서 자금계획 비교·선택, 상담자료로 이어집니다. FastAPI가 상품 조회와 계산을 처리하고, 화면 초안은 sessionStorage, 상담 기록과 상품은 PostgreSQL에 저장합니다. 기본 AI는 Gemini이며 로컬 대체 모델은 평가 완료·전환 전입니다. 배포 전 로컬 구성입니다.</desc>
