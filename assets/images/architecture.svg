<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">localhostdaegu 시스템 흐름 — 2026-09-18 main 기준</title>
  <desc id="desc">예비 창업자가 Next.js 프론트엔드에서 질문과 재무 입력을 보내면 FastAPI 백엔드의 입력 해석, 상권 진단, 자금 계산·매칭, AI 리포트 모듈이 처리합니다. 데이터는 PostgreSQL과 pgvector에 저장되고, 정기 수집이 외부 공공 데이터를 적재합니다. AI 리포트는 Gemini API로 해석 문단을 생성합니다. 배포 전 로컬 구성입니다.</desc>
