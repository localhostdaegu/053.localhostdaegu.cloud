    label: STORE OPERATIONS
    color: teal
    question: "가게의 매출과 증빙, 한눈에 이해할 수 있을까?"
    description: 매출·정산 자료를 쉽게 설명하는 방향을 검토했습니다. 실매출 데이터를 확보할 수 없어 이번 프로토타입에서는 제외하고 로드맵으로 넘겼습니다.
