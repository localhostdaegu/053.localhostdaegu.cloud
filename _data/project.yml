  - number: "02"
    name: 청년창업 매칭
    label: STARTUP CONNECTION
    color: violet
    question: "나의 창업 조건에 맞는 기회는 어디에 있을까?"
    description: 창업 비용과 자기자본으로 부족 자금을 계산하고, 조사한 금융상품 12건 중 조건에 맞는 상품을 보증 → 은행 → 정책자금 순으로 연결합니다.
    requirement: REQ-002
  - number: "03"
    name: 골목상권 AI 컨설팅
    label: LOCAL INSIGHT
    color: amber
    question: "우리 골목의 변화를 다음 결정에 활용할 수 있을까?"
    description: 인허가 이력으로 행정동별 개폐업 지표와 위험도를 보여 주고, AI 리포트가 공고·뉴스 근거와 함께 해석합니다. 지표 해석 표시는 보완 중입니다.
    requirement: REQ-003
